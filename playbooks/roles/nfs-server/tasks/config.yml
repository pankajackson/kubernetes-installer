---
  - name: Configure | Debian NFS Server
    template:
      src: "etc/default/{{ item }}.j2"
      dest: "/etc/default/{{ item }}"
      owner: "root"
      group: "root"
      mode: "u=rw,g=r,o=r"
    become: true
    notify: "restart {{ _nfs_server_service }}"
    with_items:
      - 'nfs-common'
      - 'nfs-kernel-server'
    when: ansible_os_family == "Debian"

  - name: Configure | Ensuring All Paths Exist
    file:
      dest: "{{ item['path'] }}"
      owner: "{{ _nfs_server_owner }}"
      group: "{{ _nfs_server_group }}"
      mode: "{{ item['mode']|default(omit) }}"
      state: "directory"
    become: true
    with_items: '{{ nfs_server_exports }}'
    when: nfs_server_exports is defined

  - name: Configure | Configuring /etc/exports
    template:
      src: "etc/exports.j2"
      dest: "/etc/exports"
      owner: "root"
      group: "root"
      mode: "u=rw,g=r,o=r"
    become: true
    notify: "restart {{ _nfs_server_service }}"
