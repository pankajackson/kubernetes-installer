---
  - name: Kubernetes Setup | APT
    block:
      - name: Kubernetes Setup | APT | Configure Repository | Add Kubernetes repository key
        apt_key:
          url: "{{ item.url }}"
          keyring: "{{ item.keyring }}"
          state: present
        become: true
        register: result
        retries: 3
        delay: 5
        until: "result is not failed"
        with_items:
          - url: https://pkgs.k8s.io/core:/stable:/v{{ version }}/deb/Release.key
            keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      - name: Kubernetes Setup | APT | Configure Repository | Add Kubernetes repository
        apt_repository:
          repo: "{{ item.repo }}"
          filename: "{{ item.filename }}"
          state: present
        become: true
        register: result
        retries: 3
        delay: 5
        until: "result is not failed"
        with_items:
          - repo: deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ version }}/deb/ /
            filename: /etc/apt/sources.list.d/kubernetes
      - name: Kubernetes Setup | APT | Install required packages
        apt:
          pkg:
            - kubelet
            - kubectl
            - kubeadm
          update_cache: yes
        become: true
        register: result
        retries: 3
        delay: 5
        until: "result is not failed"
      - name: Kubernetes Setup | APT | Hold/avoid auto upgrade of packages
        dpkg_selections:
          name: "{{ item }}"
          selection: hold
        with_items:
          - kubelet
          - kubeadm
          - kubectl
        become: true

  - name: Kubernetes Setup | Service
    block:
      - name: Kubernetes Setup | Service | Configure
        copy:
          dest: "/etc/default/kubelet"
          content: |
            KUBELET_EXTRA_ARGS=--node-ip={{ ansible_eth1.ipv4.address }}
        become: true
