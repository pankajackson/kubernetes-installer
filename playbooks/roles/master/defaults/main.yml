---
# defaults file for master
kubernetes:
  # Define Kubernetes network plugin, flannel or calico will be valid option
  # NOTE: crio engine and flannel network cause dns-issue in kubeernetes cluster
  # TODO: FIX DNS ISSUE for crio engine and flannel network plugin
  network_plugin: "calico"
  pod_cidr:
    calico: "192.168.0.0/16"
    flannel: "10.244.0.0/16"
  cluster_cidr: 10.0.0.0/24 #Virtualbox vboxnet0 network for Masquerading request from pod to node network
  pod_network_masquerader: true

vagrant:
  config_path: "/vagrant/configs"