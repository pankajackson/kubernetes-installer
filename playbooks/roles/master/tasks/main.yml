---
  - name: Kubernetes Setup
    include_tasks: kubernetes.yml
  - name: Flannel Setup
    include_tasks: flannel.yml
    when: kubernetes.network_plugin == "flannel"
  - name: Calico Setup
    include_tasks: calico.yml
    when: kubernetes.network_plugin == "calico"
  - name: Network Masquerader Config # Pods will be able to communicate to Cluster Nodes (Use only when it required)
    include_tasks: network_masquerader.yml
    when: kubernetes.pod_network_masquerader