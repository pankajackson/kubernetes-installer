---
  - name: Kubernetes Setup | Retrieve Configs
    block:
      - name: Kubernetes Setup | Retrieve Configs | Create {{ vagrant.config_path }} directory
        file:
          path: "{{ vagrant.config_path }}"
          state: directory
      - name: Kubernetes Setup | Retrieve Configs | Copy configs from storage to local machine
        copy:
          src: "{{ vagrant.shared_config_path }}/{{ item }}"
          dest: "{{ vagrant.config_path }}/{{ item }}"
          remote_src: true
          owner: "{{ ansible_env.USER }}"
          group: "{{ ansible_env.USER }}"
        become: true
        with_items:
          - "config"
          - "join.sh"
    when: worker_only
        
  - name: Kubernetes Setup | Node Join
    block:
      - name: Kubernetes Setup | Node Join | Add node to cluster
        command: "sh {{ vagrant.config_path }}/join.sh"
        become: true

  - name: Kubernetes Setup | Node Configuration
    block:
      - name: Kubernetes Setup | Node Configuration | Create .kube directory
        file:
          path: "{{ ansible_env.HOME }}/.kube"
          state: directory
      - name: Kubernetes Setup | Node Configuration | Copy kube config
        copy:
          src: "{{ vagrant.config_path }}/config"
          dest: "{{ ansible_env.HOME }}/.kube/config"
          remote_src: true
          owner: "{{ ansible_env.USER }}"
          group: "{{ ansible_env.USER }}"
        become: true
      - name: Kubernetes Setup | Node Configuration | Update Node role
        shell: kubectl label node {{ ansible_hostname }}.{{ domain }} node-role.kubernetes.io/worker=worker