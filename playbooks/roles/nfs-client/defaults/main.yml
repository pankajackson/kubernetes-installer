---
# defaults file for ansible-nfs-client
nfs_client_mounts: []
  # - mount:
  #   fstype: 'nfs'
  #   opts:
  #     - 'rsize=8192'
  #     - 'wsize=8192'
  #     - 'intr'
  #   path: '/opt/nfs/test1'
  #   src: '192.168.250.10:/opt/nfs/test1'
  #   state: 'mounted'

self_hosted_nfs_client_mounts:
  - mount:
    fstype: 'nfs'
    opts:
      - 'rw'
      - 'sync'
    path: "{{ vagrant.shared_config_path }}"
    src: "{{ vagrant.shared_config_path }}"
    state: 'mounted'
  - mount:
    fstype: 'nfs'
    opts:
      - 'rw'
      - 'sync'
    path: '/data/cloud-path-provisioner'
    src: '/data/cloud-path-provisioner'
    state: 'mounted'