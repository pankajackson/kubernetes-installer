---
  - name: Configure Kube Master
    block:
      - name: Initialize the cluster
        shell: kubeadm init --apiserver-advertise-address={{ ansible_default_ipv4.address }} --pod-network-cidr=192.168.0.0/16
        register: k8s_init_status
        become: true
      - name: Create .kube directory
        file:
          path: "{{ ansible_env.HOME }}/.kube"
          state: directory
      - name: Copy admin.conf to user's kube config
        copy:
          src: /etc/kubernetes/admin.conf
          dest: "{{ ansible_env.HOME }}/.kube/config"
          remote_src: true
          owner: "{{ ansible_env.USER }}"
          group: "{{ ansible_env.USER }}"
        become: true

  - name: Configure Pod Network
    block:
      - name: Upload pod network config
        copy:
          src: calico.yaml
          dest: "{{ ansible_env.HOME }}/.kube"
      - name: Install Pod network
        shell: "kubectl apply -f {{ ansible_env.HOME }}/.kube/calico.yaml"
      - name: Set env FELIX_IGNORELOOSERPF=true to ignore unwanted errors
        shell: "kubectl -n kube-system set env daemonset/calico-node FELIX_IGNORELOOSERPF=true"

  - name: Configure Kube Dashboard
    block:
      - name: Upload dashboard config
        copy:
          src: dashboard.yaml
          dest: "{{ ansible_env.HOME }}/.kube"
      - name: Install dashboard
        shell: "kubectl apply -f {{ ansible_env.HOME }}/.kube/dashboard.yaml"

  - name: wait for pods to come up
    shell: 'kubectl wait --all-namespaces --for=condition=Ready pods --all  --timeout 600s'
    register: control_plane_pods_ready
    until: control_plane_pods_ready is not failed
    retries: 5

  - name: Setup Authorization for Dashboard
    block:
      - name: Create Service Account
        shell: "kubectl create serviceaccount dashboard -n default"
      - name: Create cluster role binding with service account
        shell: "kubectl create clusterrolebinding dashboard-admin -n default --clusterrole=cluster-admin   --serviceaccount=default:dashboard"
      - name: Generate Login Token
        shell: 'kubectl get secret $(kubectl get serviceaccount dashboard -o jsonpath="{.secrets[0].name}") -o jsonpath="{.data.token}" | base64 --decode'
        register: dashboard_login_token

  - name: Configure Nginx for Kube Dashboard
    block:
      - name: Install required packages
        apt:
          pkg: "{{ required_packages }}"
          update_cache: yes
        become: true

      - name: Create Service Account for nginx-proxy
        shell: "kubectl create serviceaccount nginx-proxy -n kube-system"

      - name: Craete Cluster role bindinng to the Nginx proxy account
        shell: "kubectl create clusterrolebinding nginx-proxy --clusterrole=cluster-admin --serviceaccount=kube-system:nginx-proxy"

      - name: Get Nginx proxt secret token name
        shell: "kubectl get secrets --all-namespaces | grep nginx-proxy | awk '{ print $2 }'"
        register: nginx_proxy_token_name

      - name: Get Token for Nginx proxy
        shell: "kubectl get secret -n kube-system {{ nginx_proxy_token_name.stdout }} -o jsonpath=\"{.data.token}\" | base64 --decode"
        register: nginx_proxy_token

      - name: Get Kubernetes Dashboard Cluster IP
        shell: "kubectl get Service -n kubernetes-dashboard kubernetes-dashboard | grep dashboard | awk '{ print $3 }'"
        register: dashboard_ip_address

      - name: Setup Basic Auth for nginx proxy
        shell: "htpasswd -b -c {{ nginx['dashboard']['pass_file_path'] }} {{ nginx['dashboard']['admin_username'] }} {{ nginx['dashboard']['admin_password'] }}"
        become: true

      - name: Create Certificate Directory
        file:
          path: "{{ nginx['dashboard']['cert']['path'] }}"
          state: directory

      - name: Generate SSL Certificate for nginx
        shell: "openssl req -new -newkey rsa:4096 -x509 -sha256 -days 3650 -nodes -out {{ nginx['dashboard']['cert']['ctr'] }} -keyout {{ nginx['dashboard']['cert']['key'] }} -subj \"/C=IN/ST=MadhyaPradesh/L=Indore/O=Jackson pvt ltd/OU=Jackson/CN=*.jackson.com\""
        args:
          chdir: "{{ nginx['dashboard']['cert']['path'] }}"
        become: true

      - name: Configure Nginx
        template:
          src: nginx_kube_dashboard.conf.j2
          dest: /etc/nginx/sites-available/nginx_kube_dashboard.conf
        become: true

      - name: Enable site config
        file:
          src: "/etc/nginx/sites-available/nginx_kube_dashboard.conf"
          dest: "/etc/nginx/sites-enabled/nginx_kube_dashboard.conf"
          state: link
        become: true
        notify: "restart nginx service"


  - name: Generate and Store node joining Token
    block:
      - name: Get Node joining Token
        shell: "kubeadm token create  --print-join-command"
        register: node_joining_token
      - name: "Add K8S Token to dummy host"
        add_host:
          name:   "K8S_TOKEN_HOLDER"
          token:  "{{ node_joining_token.stdout }}"

  - name: Print Dashboard Login Details
    debug:
      msg: "{{ item }}"
    with_items:
      - "dashboard login url: http://localhost:8001/api/v1/namespaces/kubernetes-dashboard/services/https:kubernetes-dashboard:/proxy/"
      - "dashboard login token: {{dashboard_login_token.stdout}}"