---
  - name: Reset old Cluster if exist
    shell: "kubeadm reset -f"
    ignore_errors: true
    become: true

  - name: Set hostname of Machine
    hostname:
      name: "{{ hostvars[inventory_hostname].group_names[0] }}-{{ ansible_default_ipv4.address | replace('.','') | reverse }}"
    become: true

  - name: Disable Swap
    block:
      - name: Disable SWAP since kubernetes can't work with swap enabled (1/2)
        shell: |
          swapoff -a
        become: true
      - name: Disable SWAP in fstab since kubernetes can't work with swap enabled (2/2)
        replace:
          path: /etc/fstab
          regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
          replace: '# \1'
        become: true

  - name: Configure Repository
    block:
      - name: Add kubernetes repository key
        apt_key:
          url: "https://packages.cloud.google.com/apt/doc/apt-key.gpg"
          state: present
        become: true
      - name: Add kubernetes repository
        apt_repository:
          repo: deb http://apt.kubernetes.io/ kubernetes-xenial main
          state: present
          filename: 'kubernetes.list'
        become: true

  - name: Install required packages
    apt:
      pkg: "{{ required_packages }}"
      update_cache: yes
    become: true

  - name: Configure Docker
    block:
      - name: Creates docker data directory
        file:
          path: "{{ docker_data_path }}"
          state: directory
        become: true
      - name: Configure data path of docker
        template:
          src: docker.daemon.json.j2
          dest: /etc/docker/daemon.json
        become: true
        notify: "restart docker service"

  - name: Configure Basic Kube Environment
    block:
      - name: Backup kubernetes service file
        copy:
          src: /etc/systemd/system/kubelet.service.d/10-kubeadm.conf
          dest: /etc/systemd/system/kubelet.service.d/10-kubeadm.conf.bkp
          remote_src: yes
        become: true
      - name: Add cgroup-driver Environment variable in kubeadm service file
        lineinfile:
          path: /etc/systemd/system/kubelet.service.d/10-kubeadm.conf
          insertafter: '^Environment='
          line: 'Environment="cgroup-driver=systemd/cgroup-driver=cgroupfs"'
        become: true
